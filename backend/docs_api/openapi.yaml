  /api/finanzas/planillas/actual:
    get:
      tags: [M07-Finanzas]
      summary: Consultar planilla del periodo y verificación de liquidez bancaria (RN-FIN-02)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: periodo
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Planilla y disponibilidad de liquidez
          content:
            application/json:
              schema:
                type: object
                required: [ok, payroll, liquidez]
                properties:
                  ok:
                    type: boolean
                  payroll:
                    $ref: '#/components/schemas/AdminPayrollPeriod'
                  liquidez:
                    type: object
                    required: [saldo_bancario_base, ingresos_caja_hoy, liquidez_efectiva, cobertura_ok]
                    properties:
                      saldo_bancario_base:
                        type: number
                        format: double
                      ingresos_caja_hoy:
                        type: number
                        format: double
                      liquidez_efectiva:
                        type: number
                        format: double
                      cobertura_ok:
                        type: boolean
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/finanzas/planillas/calcular:
    post:
      tags: [M07-Finanzas]
      summary: Calcular planilla mensual por días laborados, bonificaciones y descuentos (RN-FIN-01)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodo]
              properties:
                periodo:
                  type: string
                  pattern: "^\\d{4}-\\d{2}$"
                asistencias:
                  type: array
                  items:
                    type: object
                    required: [empleado_id, dias_laborados]
                    properties:
                      empleado_id:
                        type: integer
                      dias_laborados:
                        type: integer
                        minimum: 0
                        maximum: 31
                      bonificaciones:
                        type: number
                        format: double
                        minimum: 0
                      descuentos:
                        type: number
                        format: double
                        minimum: 0
      responses:
        "200":
          description: Planilla recalculada con decimal.js
          content:
            application/json:
              schema:
                type: object
                required: [ok, payroll]
                properties:
                  ok:
                    type: boolean
                  payroll:
                    $ref: '#/components/schemas/AdminPayrollPeriod'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /api/finanzas/planillas/{periodo}/cerrar:
    post:
      tags: [M07-Finanzas]
      summary: Ejecutar pago y cierre inmutable de planilla (RN-FIN-02, RN-FIN-04, RN-FIN-05)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: periodo
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmado_inmutabilidad, metodo_desembolso]
              properties:
                confirmado_inmutabilidad:
                  type: boolean
                  enum: [true]
                metodo_desembolso:
                  type: string
                  enum: [transferencia, efectivo]
      responses:
        "200":
          description: Planilla pagada, MovimientoFinanciero Egreso creado y periodo bloqueado (cerrada = 1)
          content:
            application/json:
              schema:
                type: object
                required: [ok, payroll, movimiento_egreso, referencia_banco]
                properties:
                  ok:
                    type: boolean
                  payroll:
                    $ref: '#/components/schemas/AdminPayrollPeriod'
                  movimiento_egreso:
                    $ref: '#/components/schemas/PosCashMovement'
                  referencia_banco:
                    type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

