        fecha_hora:
          type: string
          format: date-time

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Verificar salud del servidor y pool SQL Server
      responses:
        "200":
          description: Servidor y base de datos operativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/config/empresa:
    get:
      tags: [Config]
      summary: Parámetros canónicos del negocio e identidad fiscal del emisor
      description: Unifica Razón Social (I&O MODA RETAIL S.A.C.), RUC (20609988771), flete S/ 10.00 (> S/ 150.00 gratis) y ventana de cambios de 7 días.
      responses:
        "200":
          description: Configuración canónica del sistema
          content:
            application/json:
              schema:
                type: object
                required: [ok, empresa]
                properties:
                  ok:
                    type: boolean
                  empresa:
                    $ref: '#/components/schemas/EmpresaConfig'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión (Empleados TN01-TN05 o Cliente AN01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        "200":
          description: Sesión iniciada con JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar cuenta de cliente externo (AN01) con opt-in desmarcado por defecto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        "201":
          description: Cliente registrado (RN-MKT-03 opt_in_marketing = false por defecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener perfil de la sesión JWT activa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/AuthUser'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión activa e invalidar token si aplica
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkAck'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/catalogo/productos:
    get:
      tags: [Catalogo]
      summary: Catálogo público agrupado por modelo (sin stock numérico para AN01)
      parameters:
        - in: query
          name: q
          schema:
            type: string
