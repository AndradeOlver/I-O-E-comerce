                      $ref: '#/components/schemas/WarehouseLoan'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [M06-Prestamos]
      summary: Registrar préstamo en consignación (plazo <= 7 días RN-PRE-02, Constancia Almacenero RN-PRE-01)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoanRequest'
