openapi: 3.0.3
info:
  title: Sistema Omnicanal I&O — API REST
  version: 1.0.0
  description: |
    Contrato REST oficial del backend Node.js + Express (TypeScript) + Microsoft SQL Server (`IO_Ecommerce`)
    para el Sistema Omnicanal I&O (Módulos Auth, Catálogo y M01–M08).
    Cubre los 7 Casos de Uso de Negocio (`CUN01`–`CUN07`), 49 códigos operativos `RN-*`
    (documentados históricamente como 42 reglas operativas) y 6 reglas de accesibilidad `RN-ACC-01..06`.
    Proyecta DTOs públicos sin exposición numérica de stock para `AN01` (regla del 24/11/2026) y DTOs internos con stock exacto para `TN01`–`TN05`.
  contact:
    name: Olver Daniel Andrade Chirinos (N00401718) & Josue Daniel Razuri Paredes (N00421512)
servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo (Express + TypeScript)
tags:
  - name: Health
    description: Estado de salud del servidor y pool SQL Server
  - name: Config
    description: Parámetros canónicos del negocio e identidad fiscal del emisor
  - name: Auth
    description: Autenticación JWT para roles internos (TN01-TN05) y clientes (AN01)
  - name: Catalogo
    description: Taxonomía 8x30, catálogo público sin stock numérico (AN01), inventario SKU interno y alta de modelos
  - name: M01-POS
    description: CUN01 Ventas presenciales en tienda, alternativas, cobros, Boleta/Factura/Nota de Crédito y arqueo
  - name: M01-Aliados
    description: Cuentas por cobrar y abonos de tiendas aliadas (enlace M06 -> Caja M01)
  - name: M02-Ecommerce
    description: CUN02 Reserva de carrito 15 min, checkout 3 pasos, 6 estados, webhook PCI-DSS y cancelación
  - name: M03-Envios
    description: CUN03 Picking post-pago, GuiaEnvio con tracking único y hasta 2 intentos de entrega
  - name: M04-Compras
    description: CUN04 Alertas stock <= 5, proveedores, órdenes de compra, reapertura, recepción y pagos
  - name: M05-Marketing
    description: CUN05 Editorial Recién Llegados, Hero, Colecciones y Campañas INDECOPI con opt-in Ley 29733
  - name: M06-Prestamos
    description: CUN06 Préstamos en consignación (<= 7 días), Constancia Formal RN-PRE-01 y cierre/deterioro
  - name: M07-Finanzas
    description: CUN07 Planilla mensual, verificación de liquidez, boletas firmadas, egresos y cierre inmutable
  - name: M08-Dashboard
    description: Mesa de Control, cola de decisiones gerenciales, analítica multicanal y bitácora AuditLog

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por /api/auth/login o /api/auth/register con rolCodigo (TN01-TN05 o AN01)

  responses:
    BadRequest:
      description: Error de sintaxis o validación Zod de campos de entrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'
    Unauthorized:
      description: Token JWT ausente, expirado o firma de webhook inválida (RN-SEG-01 / RN-SEG-02)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'
    PaymentRequired:
      description: Pago rechazado por pasarela con reintentos restantes o agotados (RN-ECO-02)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'
    Forbidden:
      description: Rol sin privilegios suficientes o intento de mutar AuditLog (RN-SEG-01 / RN-SEG-03)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'
    NotFound:
      description: Recurso o referencia foránea inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'
    Conflict:
      description: Conflicto de estado, stock insuficiente, duplicado UNIQUE/INDEX o planilla cerrada (RN-VEN-06 / RN-FIN-05)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'
    UnprocessableEntity:
      description: Violación de regla de negocio RN-* o CHECK constraint de SQL Server (Poka-Yoke / aria-live)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessRuleError'

  schemas:
    BusinessRuleError:
      type: object
      required:
        - ok
        - ruleCode
        - error
        - message
      properties:
        ok:
          type: boolean
          enum: [false]
        ruleCode:
          type: string
          example: RN-PRE-01
        error:
          type: string
          example: CONSTANCIA_FORMAL_REQUERIDA
        message:
          type: string
          example: Cuando el Gerente no está disponible, el Almacenero debe consignar el número de Constancia Formal de Préstamo.
        field:
          type: string
          nullable: true
          example: numero_constancia_formal

    OkAck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    HealthResponse:
      type: object
      required: [ok, status, service, database, timestamp]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
          example: io-omnicanal-backend
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time

    EmpresaConfig:
      type: object
      required:
        - razon_social
        - ruc
        - direccion_fiscal
        - tarifa_envio_urbano
        - umbral_envio_gratis
        - dias_cambio_tienda
        - umbral_stock_bajo
        - plazo_max_prestamo_dias
        - descuento_max_pos_pct
        - igv_pct
        - ttl_reserva_carrito_min
        - max_reintentos_pago
        - max_intentos_envio
      properties:
        razon_social:
          type: string
          example: I&O MODA RETAIL S.A.C.
        ruc:
          type: string
          example: "20609988771"
        direccion_fiscal:
          type: string
          example: Av. Larco 450, Miraflores, Lima, Perú
        tarifa_envio_urbano:
          type: number
          format: double
          example: 10.0
        umbral_envio_gratis:
          type: number
          format: double
          example: 150.0
        dias_cambio_tienda:
          type: integer
          example: 7
        umbral_stock_bajo:
          type: integer
          example: 5
        plazo_max_prestamo_dias:
          type: integer
          example: 7
        descuento_max_pos_pct:
          type: number
          format: double
          example: 10.0
        igv_pct:
          type: number
          format: double
          example: 18.0
        ttl_reserva_carrito_min:
          type: integer
          example: 15
        max_reintentos_pago:
          type: integer
          example: 3
        max_intentos_envio:
          type: integer
          example: 2

    AuthUser:
      type: object
      required: [id, rolCodigo, rol_rbac, displayName, destination]
      properties:
        id:
          type: integer
        rolCodigo:
          type: string
          enum: [TN01, TN02, TN03, TN04, TN05, AN01]
        rol_rbac:
          type: string
          enum: [Administrador, Vendedor, Community Manager, Almacenero, Cajero, Cliente]
        displayName:
          type: string
        email:
          type: string
          format: email
        destination:
          type: string
          example: /pos-vendedor.html
        opt_in_marketing:
          type: boolean

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthRegisterRequest:
      type: object
      required: [nombres, email, password]
      properties:
        nombres:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        dni_ruc:
          type: string
          pattern: "^(\\d{8}|\\d{11})$"
        telefono:
          type: string
          pattern: "^\\d{7,9}$"
        direccion:
          type: string
        opt_in_marketing:
          type: boolean
          default: false

    AuthResponse:
      type: object
      required: [ok, token, expiresAt, user]
      properties:
        ok:
          type: boolean
          enum: [true]
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/AuthUser'

    TaxonomiaMarca:
      type: object
      required: [id, nombre, monograma, especialidad]
      properties:
        id:
          type: string
        nombre:
          type: string
        monograma:
          type: string
        especialidad:
          type: string
        tagline:
          type: string
        categoryTarget:
          type: string

    TaxonomiaCategoria:
      type: object
      required: [categoria_id, slug, nombre, orden]
      properties:
        categoria_id:
          type: integer
        slug:
          type: string
        nombre:
          type: string
        subtitulo:
          type: string
        descripcion:
          type: string
        orden:
          type: integer

    TaxonomiaSubcategoria:
      type: object
      required: [subcategoria_id, categoria_id, categorySlug, slug, nombre, aplicaHombre, aplicaMujer, aplicaNinos]
      properties:
        subcategoria_id:
          type: integer
        categoria_id:
          type: integer
        categorySlug:
          type: string
        slug:
          type: string
        nombre:
          type: string
        aplicaHombre:
          type: boolean
        aplicaMujer:
          type: boolean
        aplicaNinos:
          type: boolean

    ProductPublicVariant:
      type: object
      description: Variante pública para AN01 — NUNCA expone stock numérico (regla 24/11/2026)
      required: [producto_id, variante_id, sku, talla, color, colorHex, color_textura, alt_text, precio_venta, disponible, estado_stock]
      properties:
        producto_id:
          type: integer
        variante_id:
          type: integer
        sku:
          type: string
        talla:
          type: string
        color:
          type: string
        colorHex:
          type: string
        color_textura:
          type: string
        patternId:
          type: string
        alt_text:
          type: string
        precio_venta:
          type: number
          format: double
        precio_regular:
          type: number
          format: double
          nullable: true
        disponible:
          type: boolean
        estado_stock:
          type: string
          enum: [disponible, agotado]

    ProductPublicGroup:
      type: object
      description: Modelo agrupado público (sin cantidades numéricas de stock)
      required: [producto_id, groupId, nombre, marca, categoriaSlug, genero, disponible, variants]
      properties:
        producto_id:
          type: integer
        groupId:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        fraseCorta:
          type: string
        marca:
          type: string
        categoriaSlug:
          type: string
        subcategoriaSlug:
          type: string
          nullable: true
        genero:
          type: string
          enum: [Hombre, Mujer, Ninos, Unisex]
        rango_edad:
          type: string
          nullable: true
          enum: [Bebes, Infantil, Junior, null]
        imagen_url:
          type: string
        recien_llegado:
          type: boolean
        disponible:
          type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductPublicVariant'

    PosInventoryItem:
      type: object
      description: Proyección interna de SKU para TN01-TN05 (expone stock numérico y stock_minimo)
      required: [producto_id, variante_id, groupId, sku, nombre, marca, categorySlug, talla, color, colorHex, color_textura, precio_venta, stock, stock_minimo]
      properties:
        producto_id:
          type: integer
        variante_id:
          type: integer
        groupId:
          type: string
        sku:
          type: string
        nombre:
          type: string
        marca:
          type: string
        categorySlug:
          type: string
        talla:
          type: string
        color:
          type: string
        colorHex:
          type: string
        color_textura:
          type: string
        precio_compra:
          type: number
          format: double
        precio_venta:
          type: number
          format: double
        precio_promocional_activo:
          type: number
          format: double
          nullable: true
        stock:
          type: integer
          minimum: 0
        stock_minimo:
          type: integer
          default: 5
        activo:
          type: boolean

    CreateModelRequest:
      type: object
      required: [nombre, marca, categoria_slug, genero, precio_venta, stock_inicial, tallas, color, color_hex]
      properties:
        nombre:
          type: string
          minLength: 3
        marca:
          type: string
        categoria_slug:
          type: string
        subcategoria_slug:
          type: string
        genero:
          type: string
          enum: [Hombre, Mujer, Ninos, Unisex]
        rango_edad:
          type: string
          nullable: true
          enum: [Bebes, Infantil, Junior, null]
        precio_venta:
          type: number
          format: double
          exclusiveMinimum: 0
        precio_compra:
          type: number
          format: double
          minimum: 0
        stock_inicial:
          type: integer
          minimum: 0
        tallas:
          type: array
          minItems: 1
          items:
            type: string
        color:
          type: string
        color_hex:
          type: string
        color_textura:
          type: string
        pattern_id:
          type: string
        descripcion:
          type: string
        alt_text:
          type: string

    PosAlternativeSuggestion:
      type: object
      required: [motivo, item]
      properties:
        motivo:
          type: string
          enum:
            - Talla similar disponible
            - Misma talla en otro color
            - Otro color disponible
            - Prenda similar disponible
        item:
          $ref: '#/components/schemas/PosInventoryItem'

    PosOrderItem:
      type: object
      required: [detalle_id, variante_id, sku, nombre, talla, color, cantidad, precio_unitario, descuento_linea, subtotal]
      properties:
        detalle_id:
          type: integer
        variante_id:
          type: integer
        sku:
          type: string
        nombre:
          type: string
        talla:
          type: string
        color:
          type: string
        cantidad:
          type: integer
          minimum: 1
        precio_unitario:
          type: number
          format: double
        precio_promo_aplicado:
          type: boolean
        descuento_linea:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    ComprobantePago:
      type: object
      required: [comprobante_id, pedido_cliente_id, numero, tipo, fecha, subtotal_gravado, igv, total]
      properties:
        comprobante_id:
          type: integer
        pedido_cliente_id:
          type: integer
        numero:
          type: string
          example: B001-0000101
        tipo:
          type: string
          enum: [Boleta, Factura, NotaCredito]
        fecha:
          type: string
          format: date-time
        subtotal_gravado:
          type: number
          format: double
        igv:
          type: number
          format: double
        total:
          type: number
          format: double
        motivo_anulacion:
          type: string
          nullable: true
        razon_social_emisor:
          type: string
          example: I&O MODA RETAIL S.A.C.
        ruc_emisor:
          type: string
          example: "20609988771"

    PosCashMovement:
      type: object
      required: [movimiento_id, fecha, tipo, metodo, concepto, monto]
      properties:
        movimiento_id:
          type: integer
        pedido_id:
          type: integer
          nullable: true
        fecha:
          type: string
          format: date-time
        tipo:
          type: string
          enum: [Ingreso, Egreso]
        metodo:
          type: string
          enum: [efectivo, tarjeta, yape_plin, transferencia]
        concepto:
          type: string
        monto:
          type: number
          format: double

    PosOrder:
      type: object
      required:
        - pedido_id
        - code
        - status
        - vendedor_nombre
        - cliente_referencia
        - tipo_comprobante
        - descuento_pct
        - op_gravada
        - igv
        - total
        - monto_pagado
        - saldo_pendiente
        - items
        - created_at
      properties:
        pedido_id:
          type: integer
        code:
          type: string
        status:
          type: string
          enum: [pendiente_cobro, cobrado, cancelado, anulado_nc]
        vendedor_nombre:
          type: string
        cliente_referencia:
          type: string
        tipo_comprobante:
          type: string
          enum: [Boleta, Factura]
        cliente_doc:
          type: string
          nullable: true
        cliente_razon_social:
          type: string
          nullable: true
        metodo_pago_solicitado:
          type: string
          nullable: true
          enum: [efectivo, tarjeta, yape_plin, transferencia, null]
        descuento_pct:
          type: number
          format: double
          minimum: 0
          maximum: 10
        descuento_autorizado:
          type: boolean
        op_gravada:
          type: number
          format: double
        igv:
          type: number
          format: double
        total:
          type: number
          format: double
        monto_pagado:
          type: number
          format: double
        saldo_pendiente:
          type: number
          format: double
        items:
          type: array
          items:
            $ref: '#/components/schemas/PosOrderItem'
        comprobante:
          $ref: '#/components/schemas/ComprobantePago'
        created_at:
          type: string
          format: date-time

    CreatePosOrderRequest:
      type: object
      required: [items, descuento_pct, descuento_autorizado, tipo_comprobante]
      properties:
        cliente_referencia:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, cantidad]
            properties:
              sku:
                type: string
              cantidad:
                type: integer
                minimum: 1
        descuento_pct:
          type: number
          format: double
          minimum: 0
          maximum: 10
        descuento_autorizado:
          type: boolean
        autorizacion_admin_id:
          type: integer
          nullable: true
        tipo_comprobante:
          type: string
          enum: [Boleta, Factura]
        cliente_doc:
          type: string
        cliente_razon_social:
          type: string
        metodo_pago_solicitado:
          type: string
          enum: [efectivo, tarjeta, yape_plin, transferencia]

    PosPaymentRequest:
      type: object
      required: [monto, metodo, tipo]
      properties:
        monto:
          type: number
          format: double
          exclusiveMinimum: 0
        metodo:
          type: string
          enum: [efectivo, tarjeta, yape_plin, transferencia]
        tipo:
          type: string
          enum: [pago, abono_cuenta]
        referencia_externa:
          type: string
        nota:
          type: string

    PosNotaCreditoRequest:
      type: object
      required: [motivo_anulacion]
      properties:
        motivo_anulacion:
          type: string
          minLength: 5
          maxLength: 250
        autorizacion_admin_id:
          type: integer

    PosDailySummary:
      type: object
      required: [fecha, total_cobrado, total_pendiente, por_metodo, comprobantes_emitidos]
      properties:
        fecha:
          type: string
          format: date
        total_cobrado:
          type: number
          format: double
        total_pendiente:
          type: number
          format: double
        egresos_nc:
          type: number
          format: double
        por_metodo:
          type: object
          properties:
            efectivo:
              type: number
            tarjeta:
              type: number
            yape_plin:
              type: number
            transferencia:
              type: number
        comprobantes_emitidos:
          type: integer

    PosAllyDebt:
      type: object
      required: [id, negocio_nombre, ruc, contacto, tipo, dias_plazo, descripcion_prendas, monto_total, monto_pagado, saldo_pendiente, estado]
      properties:
        id:
          type: integer
        prestamo_id:
          type: integer
          nullable: true
        negocio_nombre:
          type: string
        ruc:
          type: string
          pattern: "^\\d{11}$"
        contacto:
          type: string
        tipo:
          type: string
          enum: [consignacion, credito]
        dias_plazo:
          type: integer
          minimum: 1
        descripcion_prendas:
          type: string
        monto_total:
          type: number
          format: double
        monto_pagado:
          type: number
          format: double
        saldo_pendiente:
          type: number
          format: double
        estado:
          type: string
          enum: [pendiente, parcial, liquidado]
        created_at:
          type: string
          format: date-time

    CreateAllyDebtRequest:
      type: object
      required: [negocio_nombre, ruc, contacto, tipo, dias_plazo, descripcion_prendas, monto_total]
      properties:
        negocio_nombre:
          type: string
        ruc:
          type: string
          pattern: "^\\d{11}$"
        contacto:
          type: string
        tipo:
          type: string
          enum: [consignacion, credito]
        dias_plazo:
          type: integer
          minimum: 1
        descripcion_prendas:
          type: string
        monto_total:
          type: number
          format: double
          exclusiveMinimum: 0

    CartReserveRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, cantidad]
            properties:
              producto_id:
                type: integer
              sku:
                type: string
              cantidad:
                type: integer
                minimum: 1
        opt_in_marketing:
          type: boolean
          default: false

    CartReserveResponse:
      type: object
      required: [ok, reserva_id, reserva_expira_en, seconds_remaining, subtotal, costo_envio, envio_gratis, total]
      properties:
        ok:
          type: boolean
          enum: [true]
        reserva_id:
          type: string
        reserva_expira_en:
          type: string
          format: date-time
        seconds_remaining:
          type: integer
          example: 900
        subtotal:
          type: number
          format: double
        costo_envio:
          type: number
          format: double
          example: 10.0
        envio_gratis:
          type: boolean
        total:
          type: number
          format: double

    CreateEcommerceOrderRequest:
      type: object
      required: [items, cliente, envio, comprobante, opt_in_marketing]
      properties:
        reserva_id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, cantidad]
            properties:
              sku:
                type: string
              cantidad:
                type: integer
                minimum: 1
        cliente:
          type: object
          required: [dni_ruc, nombres, telefono, email]
          properties:
            dni_ruc:
              type: string
              pattern: "^(\\d{8}|\\d{11})$"
            nombres:
              type: string
            telefono:
              type: string
              pattern: "^\\d{7,9}$"
            email:
              type: string
              format: email
        envio:
          type: object
          required: [modalidad_entrega]
          properties:
            modalidad_entrega:
              type: string
              enum: [Retiro en tienda, Envío courier]
            distrito:
              type: string
            direccion:
              type: string
            referencia:
              type: string
        comprobante:
          type: object
          required: [tipo]
          properties:
            tipo:
              type: string
              enum: [Boleta, Factura]
