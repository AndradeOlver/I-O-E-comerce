    EcommerceOrder:
      type: object
      required:
        - pedido_id
        - pedido_ref
        - estado_online
        - reintentos_pago
        - subtotal
        - costo_envio
        - total
        - modalidad_entrega
      properties:
        pedido_id:
          type: integer
        pedido_ref:
          type: string
          example: WEB-2026-0041
        estado_online:
          type: string
          enum:
            - Pendiente de pago
            - Pago rechazado
            - En preparación
            - En envío
            - Entregado
            - Cancelado
        reintentos_pago:
          type: integer
          minimum: 0
          maximum: 3
        reserva_expira_en:
          type: string
          format: date-time
          nullable: true
        modalidad_entrega:
          type: string
          enum: [Retiro en tienda, Envío courier]
        subtotal:
          type: number
          format: double
        costo_envio:
          type: number
          format: double
        total:
          type: number
          format: double
        pasarela_session_token:
          type: string
          nullable: true
        tracking_code:
          type: string
          nullable: true
        intentos_entrega:
          type: integer
          nullable: true
        comprobante_numero:
          type: string
          nullable: true

    EcommercePayRequest:
      type: object
