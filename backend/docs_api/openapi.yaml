  /api/dashboard/analitica:
    get:
      tags: [M08-Dashboard]
      summary: Analítica multicanal, valuación por categoría, cuotas INDECOPI y resumen operativo
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: desde
          schema:
            type: string
            format: date
        - in: query
          name: hasta
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Métricas analíticas agregadas
          content:
            application/json:
              schema:
                type: object
                required: [ok, analytics]
                properties:
                  ok:
                    type: boolean
                  analytics:
                    type: object
                    properties:
                      canal_breakdown:
                        type: object
                        properties:
                          pos_tienda:
                            type: number
                          ecommerce_web:
                            type: number
                      categorias:
                        type: array
                        items:
                          type: object
                          properties:
                            categoria:
                              type: string
                            unidades:
                              type: integer
                            valorizacion:
                              type: number
                      campanas_activas:
                        type: array
                        items:
                          $ref: '#/components/schemas/MarketingCampaign'
                      proveedores_resumen:
                        type: object
                      consignaciones_resumen:
                        type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/dashboard/auditoria:
    get:
      tags: [M08-Dashboard]
      summary: Consultar bitácora forense inmutable dbo.AuditLog (RN-SEG-03)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: modulo
          schema:
            type: string
            enum: [todas, M01, M02, M03, M04, M05, M06, M07, M08, Auth, Catalogo]
        - in: query
          name: regla
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Entradas inmutables de auditoría
          content:
            application/json:
              schema:
                type: object
                required: [ok, entries, total]
                properties:
                  ok:
                    type: boolean
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAuditEntry'
                  total:
                    type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
